
name: Selenium Java Tests & Docker Publish

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  selenium-test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version

      - name: Run Selenium TestNG tests
        run: mvn --batch-mode clean test

  build-and-publish-docker:
    name: Build and Publish Docker Image
    needs: selenium-test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

	  - name: Set up Docker Buildx
		uses: docker/setup-buildx-action@v3
		with:
		  driver-opts: |
		    network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:${{ github.sha }}
